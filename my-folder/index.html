<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AWS Employee Management</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<header>

    <div class="header-container">

        <h1>AWS Employee Management</h1>

        <p>EC2 + RDS + Application Load Balancer</p>

    </div>

</header>


<main>


<section class="dashboard">

    <div class="card">

        <h3>Total Employees</h3>

        <p id="totalEmployees">0</p>

    </div>


    <div class="card">

        <h3>IT</h3>

        <p id="itEmployees">0</p>

    </div>


    <div class="card">

        <h3>Support</h3>

        <p id="supportEmployees">0</p>

    </div>


    <div class="card">

        <h3>HR</h3>

        <p id="hrEmployees">0</p>

    </div>

</section>



<section class="employee-form">

    <h2>Add Employee</h2>


    <form id="employeeForm">


        <input
            type="text"
            id="employee_id"
            placeholder="Employee ID"
            required
        >


        <input
            type="text"
            id="name"
            placeholder="Employee Name"
            required
        >


        <input
            type="email"
            id="email"
            placeholder="Email"
            required
        >


        <input
            type="text"
            id="department"
            placeholder="Department"
            required
        >


        <input
            type="text"
            id="designation"
            placeholder="Designation"
            required
        >


        <button type="submit">
            Add Employee
        </button>


    </form>

</section>



<section class="employee-list">

    <h2>Employees</h2>


    <table>

        <thead>

            <tr>

                <th>Employee ID</th>

                <th>Name</th>

                <th>Email</th>

                <th>Department</th>

                <th>Designation</th>

                <th>Action</th>

            </tr>

        </thead>


        <tbody id="employeeTable">

        </tbody>


    </table>

</section>


</main>


<footer>

    <p>
        AWS Employee Management Project
    </p>

</footer>


<script src="script.js"></script>


</body>

</html>
